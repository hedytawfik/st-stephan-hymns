<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,collection,setDoc,updateDoc,deleteDoc,addDoc,getDoc,getDocs,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDzwsI16FIykoU5e05QKsyPDMyx3HfT88g",authDomain:"st-stephan-hymns.firebaseapp.com",projectId:"st-stephan-hymns",storageBucket:"st-stephan-hymns.firebasestorage.app",messagingSenderId:"1076299422054",appId:"1:1076299422054:web:f9f042996d7342351ed0a7"};
const app=initializeApp(firebaseConfig),auth=getAuth(app);
let fs;try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=getFirestore(app)}
/* محوّل بسيط يحافظ على نفس واجهة db المستخدمة في التطبيق */
const db={
 doc(path){const r=doc(fs,...path.split('/'));return {set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}},
 collection(c){return {onSnapshot:(cb,eb)=>onSnapshot(collection(fs,c),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),eb),add:d=>addDoc(collection(fs,c),d)}}
};
let ownerUid=null;
async function prepare(u){
 try{await setDoc(doc(fs,'users',u.uid),{name:u.displayName||u.email||'',email:u.email||''},{merge:true})}catch(e){}
 const r=doc(fs,'meta','owner');
 try{await runTransaction(fs,async tx=>{const s=await tx.get(r);if(!s.exists())tx.set(r,{uid:u.uid,at:Date.now()})})}catch(e){}
 try{const s=await getDoc(r);ownerUid=s.exists()?s.data().uid:null}catch(e){ownerUid=null}
}
const user={
 me:async()=>{const u=auth.currentUser;return {id:u.uid,name:u.displayName||u.email||'',isOwner:ownerUid===u.uid}},
 search:async q=>{q=String(q||'').trim().toLowerCase();const s=await getDocs(collection(fs,'users'));return s.docs.map(d=>{const x=d.data();return {id:d.id,name:(x.name||'')+(x.email?' ('+x.email+')':''),raw:((x.name||'')+' '+(x.email||'')).toLowerCase()}}).filter(p=>p.raw.indexOf(q)>=0).slice(0,10)},
 profiles:async ids=>{const o={};await Promise.all(ids.map(async id=>{try{const s=await getDoc(doc(fs,'users',id));if(s.exists())o[id]={name:s.data().name||s.data().email||''}}catch(e){}}));return o}
};
window._fbres({db,user,
 onUser:cb=>onAuthStateChanged(auth,async u=>{if(u)await prepare(u);cb(u)}),
 google:()=>signInWithPopup(auth,new GoogleAuthProvider()),
 login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
 signup:async(e,p,n)=>{const c=await createUserWithEmailAndPassword(auth,e,p);if(n){await updateProfile(c.user,{displayName:n});try{await setDoc(doc(fs,'users',c.user.uid),{name:n,email:e},{merge:true})}catch(x){}}},
 reset:e=>sendPasswordResetEmail(auth,e),
 out:()=>signOut(auth)});
</script>

}

async function runSeedData(){
 var msgBox=document.getElementById('seedMsg');
 if(msgBox) msgBox.innerHTML='⏳ جاري رفع البيانات، يرجى الانتظار...';
 try {
  const hymns=[
   {id:'h1', name:'لحن أوجي إيهورا (الوضوح)', ord:1, text:'لحن العبادة في الخماسين المقدسة'},
   {id:'h2', name:'لحن طى شويس', ord:2, text:'من الألحان الأساسية في القداس الإلهي'}
  ];
  for(let h of hymns){
   await db.doc('hymns/'+h.id).set(h);
  }

  const students=[
   {id:'1001', name:'مينا جرجس', cls:0, wa:'01234567890', sex:'ولد', school:'مدرسة الشهداء', grade:'أول إعدادي', bd:'2012-05-10'},
   {id:'1002', name:'بيلا عماد', cls:3, wa:'01223344556', sex:'بنت', school:'مدرسة النزهة', grade:'ثاني إعدادي', bd:'2011-08-15'}
  ];
  for(let s of students){
   let id=s.id; delete s.id;
   await db.doc('kids/'+id).set(s);
  }

  if(msgBox) msgBox.innerHTML='✅ تم رفع البيانات الأولية بنجاح تام! يمكنك الانتقال لتبويب "المخدومين" أو "الألحان" لتراها ظهرت فوراً.';
 } catch(e){
  console.error(e);
  if(msgBox) msgBox.innerHTML='❌ حدث خطأ أثناء الرفع، تأكد من اتصال الإنترنت وصلاحيات الأدمن.';
 }
}

function fbErr(e){var c=String((e&&e.code)||''),m={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/wrong-password':'كلمة المرور غير صحيحة','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/email-already-in-use':'هذا البريد مسجّل بالفعل','auth/weak-password':'كلمة المرور ضعيفة','auth/popup-closed-by-user':'تم إغلاق نافذة الدخول','auth/unauthorized-domain':'هذا الموقع غير مضاف في Authorized domains','auth/operation-not-allowed':'طريقة الدخول غير مفعّلة','auth/invalid-email':'البريد غير صالح','auth/network-request-failed':'تعذّر الاتصال بالإنترنت','auth/missing-password':'اكتبي كلمة المرور'};return m[c]||('حدث خطأ: '+c)}
function fbGoogle(){window._api.google().catch(function(e){loginView(fbErr(e))})}

 var pr=mode==0?a.login(e,p):mode==1?a.signup(e,p,n):a.reset(e).then(function(){loginView('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك')});pr.catch(function(x){loginView(fbErr(x))})}
